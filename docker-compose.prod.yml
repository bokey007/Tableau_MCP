# =============================================================================
# Docker Compose - Production
# =============================================================================
# Tableau MCP AI Agent Platform - Production Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tableau-mcp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - tableau-mcp-network
    # No external port exposure in production

  # ===========================================================================
  # Tableau MCP Server
  # ===========================================================================
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: always
    environment:
      TRANSPORT: http
      PORT: 3927
      SERVER: ${TABLEAU_SERVER}
      SITE_NAME: ${TABLEAU_SITE_NAME}
      PAT_NAME: ${TABLEAU_PAT_NAME}
      PAT_VALUE: ${TABLEAU_PAT_VALUE}
      DANGEROUSLY_DISABLE_OAUTH: "false"
      # OAuth Configuration (for production)
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-}
      ENABLE_SERVER_LOGGING: "true"
      DEFAULT_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3927/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # FastAPI Backend
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: WARNING
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      API_PREFIX: /api/v1
      CORS_ORIGINS: ${CORS_ORIGINS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}
      MCP_SERVER_URL: http://mcp:3927/tableau-mcp
      MCP_REQUEST_TIMEOUT: "60"
      ENABLE_ACTIVITY_TRACKING: "true"
      ACTIVITY_RETENTION_DAYS: "90"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # Streamlit Frontend
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tableau-mcp-network

# =============================================================================
# Networks
# =============================================================================
networks:
  tableau-mcp-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
