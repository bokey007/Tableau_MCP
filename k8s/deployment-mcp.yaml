# =============================================================================
# MCP Server Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tableau-mcp-server
  namespace: tableau-mcp
  labels:
    app.kubernetes.io/name: tableau-mcp-server
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tableau-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tableau-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: tableau-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3927
              protocol: TCP
          env:
            # From ConfigMap
            - name: TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: MCP_TRANSPORT
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: MCP_PORT
            - name: SERVER
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: TABLEAU_SERVER
            - name: SITE_NAME
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: TABLEAU_SITE_NAME
            - name: DANGEROUSLY_DISABLE_OAUTH
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: MCP_DANGEROUSLY_DISABLE_OAUTH
            - name: ENABLE_SERVER_LOGGING
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: MCP_ENABLE_LOGGING
            - name: DEFAULT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tableau-mcp-config
                  key: MCP_LOG_LEVEL
            # From Secrets
            - name: PAT_NAME
              valueFrom:
                secretKeyRef:
                  name: tableau-mcp-secrets
                  key: TABLEAU_PAT_NAME
            - name: PAT_VALUE
              valueFrom:
                secretKeyRef:
                  name: tableau-mcp-secrets
                  key: TABLEAU_PAT_VALUE
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3927
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3927
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
