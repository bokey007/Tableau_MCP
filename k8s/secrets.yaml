# =============================================================================
# Kubernetes Secrets
# =============================================================================
# IMPORTANT: Use proper secret management in production (Vault, External Secrets)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tableau-mcp-secrets
  namespace: tableau-mcp
type: Opaque
stringData:
  # OpenAI
  OPENAI_API_KEY: "sk-your-openai-api-key-here"

  # Tableau
  TABLEAU_PAT_NAME: "your-pat-name"
  TABLEAU_PAT_VALUE: "your-pat-value"

  # Database
  POSTGRES_USER: "tableau_mcp"
  POSTGRES_PASSWORD: "your-secure-password-here"

  # App
  SECRET_KEY: "your-secret-key-here"
