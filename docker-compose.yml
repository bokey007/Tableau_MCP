# =============================================================================
# Docker Compose - Development
# =============================================================================
# Tableau MCP AI Agent Platform
# Usage: docker compose up --build
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tableau-mcp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tableau_mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tableau_mcp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tableau_mcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # Tableau MCP Server (with Direct Trust Connected Apps)
  # ===========================================================================
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: tableau-mcp-server
    environment:
      # Transport
      TRANSPORT: http
      PORT: 3927

      # Tableau Configuration
      SERVER: ${TABLEAU_SERVER:-}
      SITE_NAME: ${TABLEAU_SITE_NAME:-}

      # Authentication: Direct Trust (Connected Apps)
      AUTH: direct-trust

      # Connected Apps credentials
      CONNECTED_APP_CLIENT_ID: ${TABLEAU_CONNECTED_APP_CLIENT_ID:-}
      CONNECTED_APP_SECRET_ID: ${TABLEAU_CONNECTED_APP_SECRET_ID:-}
      CONNECTED_APP_SECRET_VALUE: ${TABLEAU_CONNECTED_APP_SECRET_VALUE:-}

      # JWT Subject Claim - your Tableau username
      JWT_SUB_CLAIM: ${TABLEAU_USERNAME:-}

      # MCP Settings
      DANGEROUSLY_DISABLE_OAUTH: "true"
      ENABLE_SERVER_LOGGING: "true"
      DEFAULT_LOG_LEVEL: info
    ports:
      - "3927:3927"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-O", "-", "http://localhost:3927/tableau-mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # FastAPI Backend
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tableau-mcp-backend
    environment:
      # App
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}

      # API
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      API_PREFIX: /api/v1
      CORS_ORIGINS: "http://localhost:8501,http://localhost:3000"

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-tableau_mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tableau_mcp_db}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}

      # MCP Server
      MCP_SERVER_URL: http://mcp:3927/tableau-mcp
      MCP_REQUEST_TIMEOUT: "180"

      # Tableau (also passed for direct API access if needed)
      TABLEAU_SERVER: ${TABLEAU_SERVER:-}
      TABLEAU_SITE_NAME: ${TABLEAU_SITE_NAME:-}
      TABLEAU_CONNECTED_APP_CLIENT_ID: ${TABLEAU_CONNECTED_APP_CLIENT_ID:-}
      TABLEAU_CONNECTED_APP_SECRET_ID: ${TABLEAU_CONNECTED_APP_SECRET_ID:-}
      TABLEAU_CONNECTED_APP_SECRET_VALUE: ${TABLEAU_CONNECTED_APP_SECRET_VALUE:-}
      TABLEAU_USERNAME: ${TABLEAU_USERNAME:-}

      # Activity Tracking
      ENABLE_ACTIVITY_TRACKING: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tableau-mcp-network

  # ===========================================================================
  # Streamlit Frontend
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tableau-mcp-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tableau-mcp-network

# =============================================================================
# Networks
# =============================================================================
networks:
  tableau-mcp-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
