<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Analytics Agent</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tableau Extensions API -->
    <script src="https://extensions.tableau.com/api/v1/tableau.extensions.1.latest.min.js"></script>
    <style>
      /* Markdown content styling */
      .message-content h1, .message-content h2, .message-content h3 {
        margin-top: 12px;
        margin-bottom: 8px;
        color: var(--text-primary);
      }
      .message-content h3 { font-size: 14px; }
      .message-content h2 { font-size: 15px; }
      .message-content h1 { font-size: 16px; }
      .message-content ul, .message-content ol {
        margin: 8px 0 8px 20px;
        padding: 0;
      }
      .message-content li { margin: 4px 0; }
      .message-content p { margin: 8px 0; }
      .message-content strong { color: var(--primary-color); }
      .message-content code {
        background: var(--surface-light);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      .message-content pre {
        background: var(--surface-light);
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .message-content pre code {
        background: none;
        padding: 0;
      }
      .message-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 12px;
      }
      .message-content th, .message-content td {
        padding: 8px;
        border: 1px solid var(--border-color);
        text-align: left;
      }
      .message-content th {
        background: var(--surface-light);
      }
      /* Chart container */
      .chart-container {
        background: var(--surface);
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
        max-width: 500px;
      }
      .chart-container canvas {
        max-height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="extension-container">
      <!-- Header -->
      <div class="header">
        <div class="header-icon">🤖</div>
        <div class="header-text">
          <h1>AI Analytics</h1>
          <span class="status" id="connectionStatus">Connecting...</span>
        </div>
      </div>

      <!-- Chat Messages -->
      <div class="chat-container" id="chatContainer">
        <div class="message assistant">
          <div class="message-content">
            Hello! I can help you analyze your data. Try these:
            <ul style="margin: 6px 0 0 16px; padding: 0; font-size: 12px;">
              <li>📊 <strong>Compare</strong> periods or regions</li>
              <li>🔍 <strong>Find anomalies</strong> or outliers</li>
              <li>📖 <strong>Summarize</strong> this dashboard</li>
              <li>📈 <strong>Top N</strong> products/customers</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div id="quickActions" style="padding: 6px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border-color);">
        <button onclick="quickQuery('Compare Q1 vs Q2')" style="padding: 3px 10px; font-size: 10px; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; color: var(--text-primary);">📊 Compare</button>
        <button onclick="quickQuery('What anomalies are in this data?')" style="padding: 3px 10px; font-size: 10px; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; color: var(--text-primary);">🔍 Anomalies</button>
        <button onclick="quickQuery('Executive summary of this dashboard')" style="padding: 3px 10px; font-size: 10px; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; color: var(--text-primary);">📖 Summary</button>
        <button onclick="quickQuery('Top 5 by sales')" style="padding: 3px 10px; font-size: 10px; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; color: var(--text-primary);">📈 Top 5</button>
        <label style="margin-left: auto; display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--text-secondary);">
          <input type="checkbox" id="streamingMode" checked style="width: 12px; height: 12px;"> Stream
        </label>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <input
            type="text"
            id="userInput"
            placeholder="Ask a question about your data..."
            autocomplete="off"
          />
          <button id="sendBtn" onclick="sendMessage()">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
        <div class="input-hint">Press Enter to send • Streaming enabled • Powered by AI</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
