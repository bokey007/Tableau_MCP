[project]
name = "tableau-mcp-frontend"
version = "1.0.0"
description = "Streamlit frontend for Tableau MCP AI Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Streamlit
    "streamlit>=1.30.0",
    
    # HTTP Client
    "httpx>=0.26.0",
    
    # Data & Visualization
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    
    # Utilities
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
